name: Monitor de partidos en vivo (Superagente Quant)

# Cada 15 minutos -- con el plan de pago "20K" de The Odds API
# (USD $30/mes, 20,000 créditos/mes, activo desde ago-2026) hay
# presupuesto de sobra para revisar las 13 ligas completas a esta
# frecuencia; ver la explicación completa al inicio de
# telegram_alert_bot.py. El propio script se detiene solo si en algún
# momento quedan pocos créditos disponibles ese mes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  revisar-partidos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python telegram_alert_bot.py

      - name: Guardar el registro de alertas ya enviadas
        run: |
          git config user.name "agente-quant-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain estado/)" ]; then
            git add estado/
            git commit -m "Actualiza registro de alertas enviadas [skip ci]"
            git push
          else
            echo "Sin cambios en el registro de alertas."
          fi
