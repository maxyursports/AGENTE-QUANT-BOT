name: Monitor de partidos en vivo (Superagente Quant)

# PAUSADO 2026-09-14 -- pedido explicito del propietario ("el bot de
# cuotas en vivo dejalo apagado definitivamente hasta que yo te diga
# que lo activemos"). El cron de "cada 15 minutos" se retira por
# completo del trigger automatico: solo queda workflow_dispatch, asi
# que esto SOLO corre si alguien lo dispara manualmente desde la
# pestaña Actions. No lo reactives (no le agregues de nuevo un bloque
# "schedule:") a menos que el propietario lo pida explicitamente.
#
# Motivo: se confirmo que este workflow llevaba corriendo cada 15
# minutos de forma continua (111+ corridas), consumiendo creditos
# reales de The Odds API (revisa 25 ligas por corrida, ~25-50
# creditos/corrida) sin que el propietario lo supiera -- se le habia
# dicho que quedaba "apagado" pero el cron seguia activo en este
# archivo. Ver telegram_alert_bot.py para el detalle del bot en si
# (ese codigo NO se toco, solo se le quito el disparador automatico).
on:
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  revisar-partidos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python telegram_alert_bot.py

      - name: Guardar el registro de alertas ya enviadas
        run: |
          git config user.name "agente-quant-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain estado/)" ]; then
            git add estado/
            git commit -m "Actualiza registro de alertas enviadas [skip ci]"
            git push
          else
            echo "Sin cambios en el registro de alertas."
          fi
