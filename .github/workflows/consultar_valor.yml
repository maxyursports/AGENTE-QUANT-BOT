name: Consultar valor pre-partido (temporal)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Ejecutar consulta
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python consultar_valor.py
