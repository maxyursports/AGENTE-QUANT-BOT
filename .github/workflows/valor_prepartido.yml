name: Valor pre-partido (Superagente Quant)

# Reactivado en automatico -- 2026-09-11. Ver CHANGELOG.md para el
# detalle de la decision: se reactiva el cron sin completar el periodo
# de validacion multi-dia de Closing Line Value (CLV) documentado en el
# circuit breaker de DISCIPLINA.md (2026-08-29). Decision tomada a
# pedido explicito del usuario, aceptando ese riesgo. Monitorear de
# cerca los resultados de los primeros dias y estar listos para volver
# a MODO_SOLO_REGISTRO o pausar el cron si se repite la tasa de ruido
# que origino la pausa anterior (23 y 15 "hallazgos" en las primeras 2
# corridas reales).
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar-valor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar busqueda de valor pre-partido
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python valor_prepartido.py

      - name: Guardar historial de cuotas
        run: |
          git config user.name "agente-quant-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain estado/)" ]; then
            git add estado/
            git commit -m "Actualiza historial de cuotas pre-partido [skip ci]"
            git push
          else
            echo "Sin cambios en el historial de cuotas."
          fi
