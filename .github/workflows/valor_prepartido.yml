name: Valor pre-partido (Superagente Quant)

# Reactivado en automatico -- 2026-09-13. Ver CHANGELOG.md para el
# detalle de la decision: se reactiva el cron sin completar el periodo
# de validacion multi-dia de Closing Line Value (CLV) documentado en el
# circuit breaker de DISCIPLINA.md (2026-08-29). Decision tomada a
# pedido explicito del usuario, aceptando ese riesgo. Monitorear de
# cerca los resultados de los primeros dias y estar listos para volver
# a MODO_SOLO_REGISTRO o pausar el cron de nuevo si se repite la tasa
# de ruido que origino la pausa anterior (23 y 15 "hallazgos" en las
# primeras 2 corridas reales).
#
# Horario simplificado el 2026-09-13 (tercer ajuste, mismo dia) a
# pedido explicito del propietario: en vez de varias corridas al dia,
# ahora solo 2 corridas diarias, a las 4am y a las 4pm hora Colombia
# (09:00 y 21:00 UTC). Como las 2 corridas quedan exactamente 12 horas
# separadas entre si, VENTANA_HORAS se fija en 12 para que cada
# corrida cubra exactamente hasta la siguiente, sin huecos ni
# solapamiento.
#
# En el mismo cambio se amplio la cobertura de ligas de futbol (ver
# LIGAS_FUTBOL en valor_prepartido.py) de 35 a 46, para darle al
# agente mas oportunidades de encontrar valor, aprovechando el
# presupuesto de creditos que sobra al bajar de 4 a 2 corridas
# diarias. Con 46 ligas de futbol + basquet/hockey/beisbol fijos +
# tenis/eSports dinamicos (hasta 8 y 6 respectivamente), el consumo
# mensual queda, en el peor caso posible (mes de 31 dias, tenis y
# eSports al maximo en las 2 corridas de cada dia), en aproximadamente
# 19,900 creditos -- por debajo del tope de 20,000 creditos/mes del
# plan contratado (USD $30/mes), sin superarlo nunca. En meses mas
# cortos o con menos torneos activos el consumo real sera menor a
# esa cifra.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar-valor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar busqueda de valor pre-partido
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          VENTANA_HORAS: "12"
        run: python valor_prepartido.py

      - name: Guardar historial de cuotas
        run: |
          git config user.name "agente-quant-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain estado/)" ]; then
            git add estado/
            git commit -m "Actualiza historial de cuotas pre-partido [skip ci]"
            git push
          else
            echo "Sin cambios en el historial de cuotas."
          fi
