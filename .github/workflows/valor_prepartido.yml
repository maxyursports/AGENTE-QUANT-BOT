name: Valor pre-partido (Superagente Quant)

# Reactivado en automatico -- 2026-09-13. Ver CHANGELOG.md para el
# detalle de la decision: se reactiva el cron sin completar el periodo
# de validacion multi-dia de Closing Line Value (CLV) documentado en el
# circuit breaker de DISCIPLINA.md (2026-08-29). Decision tomada a
# pedido explicito del usuario, aceptando ese riesgo. Monitorear de
# cerca los resultados de los primeros dias y estar listos para volver
# a MODO_SOLO_REGISTRO o pausar el cron de nuevo si se repite la tasa
# de ruido que origino la pausa anterior (23 y 15 "hallazgos" en las
# primeras 2 corridas reales).
#
# AJUSTE 2026-09-17 (pedido explicito del usuario: "quiero hacer las
# corridas de forma manual mejor segun mi disposicion de tiempo, puede
# que sea 1 o 4 al dia"): se elimina el cron automatico (antes 4am y
# 4pm hora Colombia). De aqui en adelante el bot SOLO se ejecuta via
# workflow_dispatch (boton "Run workflow" en la pestaña Actions de
# GitHub), a discrecion del propietario, tantas veces al dia como
# quiera. No hay ejecuciones automaticas de ningun tipo.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar-valor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar busqueda de valor pre-partido
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python valor_prepartido.py

      - name: Guardar historial de cuotas
        run: |
          git config user.name "agente-quant-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain estado/)" ]; then
            git add estado/
            git commit -m "Actualiza historial de cuotas pre-partido [skip ci]"
            git push
          else
            echo "Sin cambios en el historial de cuotas."
          fi
