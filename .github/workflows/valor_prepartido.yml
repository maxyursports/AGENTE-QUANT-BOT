name: Valor pre-partido (Superagente Quant)

# Reactivado en automatico -- 2026-09-13. Ver CHANGELOG.md para el
# detalle de la decision: se reactiva el cron sin completar el periodo
# de validacion multi-dia de Closing Line Value (CLV) documentado en el
# circuit breaker de DISCIPLINA.md (2026-08-29). Decision tomada a
# pedido explicito del usuario, aceptando ese riesgo. Monitorear de
# cerca los resultados de los primeros dias y estar listos para volver
# a MODO_SOLO_REGISTRO o pausar el cron de nuevo si se repite la tasa
# de ruido que origino la pausa anterior (23 y 15 "hallazgos" en las
# primeras 2 corridas reales).
#
# Horario ajustado el mismo dia (2026-09-13) para cubrir las 24 horas
# sin huecos: VENTANA_HORAS en valor_prepartido.py es de 6 horas hacia
# adelante desde el momento de cada corrida, asi que 4 corridas cada 6
# horas exactas cubren el dia completo sin dejar ninguna franja sin
# revisar y sin solaparse entre si. Horarios en UTC (hora Colombia
# entre parentesis): 05:00 (00:00), 11:00 (06:00), 17:00 (12:00) y
# 23:00 (18:00).
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar-valor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar busqueda de valor pre-partido
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python valor_prepartido.py

      - name: Guardar historial de cuotas
        run: |
          git config user.name "agente-quant-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain estado/)" ]; then
            git add estado/
            git commit -m "Actualiza historial de cuotas pre-partido [skip ci]"
            git push
          else
            echo "Sin cambios en el historial de cuotas."
          fi
