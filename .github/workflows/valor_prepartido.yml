name: Valor pre-partido (Superagente Quant)

# PAUSADO EN AUTOMATICO -- 2026-08-29 (aplicando el circuit breaker de
# DISCIPLINA.md). Las primeras 2 corridas reales encontraron 23 y 15
# "hallazgos" de valor respectivamente, una tasa demasiado alta para
# ser creible como ventaja real -- el metodo de comparar la mejor cuota
# contra la mediana del mercado sigue produciendo bastante ruido con
# solo 5-8 casas por partido. Se quita el cron automatico (schedule) y
# se deja SOLO ejecucion manual (workflow_dispatch) hasta que el metodo
# se valide mejor (ver CHANGELOG.md) -- por ejemplo, comparando contra
# el Brier score de un periodo de prueba, o incorporando el modelo Elo
# propio (elo_model.py) como fuente adicional de probabilidad antes de
# confiar en estas alertas. NO reactivar el cron sin antes documentar
# la correccion en CHANGELOG.md (regla de disciplina, no ajustar en
# caliente sin registrar el motivo).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar-valor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar busqueda de valor pre-partido
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python valor_prepartido.py

      - name: Guardar historial de cuotas
        run: |
          git config user.name "agente-quant-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain estado/)" ]; then
            git add estado/
            git commit -m "Actualiza historial de cuotas pre-partido [skip ci]"
            git push
          else
            echo "Sin cambios en el historial de cuotas."
          fi
